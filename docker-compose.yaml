services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: observatory
      POSTGRES_PASSWORD: observatory
      POSTGRES_DB: observatory
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U observatory"]
      interval: 5s
      retries: 10

  airflow:
    build: .
    command: standalone
    depends_on:
      postgres:
        condition: service_healthy
    env_file: [.env]
    environment:
      DATABASE_URL: postgresql://observatory:observatory@postgres:5432/observatory
      PYTHONPATH: /opt/airflow
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    ports: ["8080:8080"]
    volumes:
      - ./dags:/opt/airflow/dags
      - ./src:/opt/airflow/src
      - ./sql:/opt/airflow/sql
      - ./data:/opt/airflow/data

volumes:
  pgdata:
